<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>LoteCUU — Diseño</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'Manrope', sans-serif; }
  body { background: #f0eee9; }
  .lc-artboard-frame { width: 100%; height: 100%; overflow: auto; background: var(--bg-primary); }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <rect width="200" height="200" fill="#1E232B"/>
    <g transform="translate(50,60)">
      <path d="M10 80 L50 10 L90 80 Z" fill="none" stroke="#255C7A" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="50" cy="50" r="6" fill="#255C7A"/>
      <path d="M70 80 L100 10 M85 80 L115 10" stroke="#E56A2E" stroke-width="6" stroke-linecap="round"/>
    </g>
  </svg>
</template>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="lib.jsx"></script>
<script type="text/babel" src="gallery.jsx"></script>
<script type="text/babel" src="feed.jsx"></script>
<script type="text/babel" src="ficha.jsx"></script>
<script type="text/babel" src="seller.jsx"></script>
<script type="text/babel" src="admin.jsx"></script>

<script type="text/babel" data-presets="react">
function ArtboardFrame({ children }) {
  return <div className="lc-artboard-frame">{children}</div>;
}

// A small router so the user can navigate feed → ficha → vendedor.
function Flow({ mode, initial = { view: 'feed' } }) {
  const [state, setState] = React.useState(initial);

  const goFeed = () => setState({ view: 'feed' });
  const goCar = (carId) => setState({ view: 'ficha', carId });
  const goSeller = (sellerId) => setState({ view: 'seller', sellerId });

  if (state.view === 'ficha') {
    return <FichaScreen mode={mode} carId={state.carId} onBack={goFeed} onOpenSeller={goSeller} />;
  }
  if (state.view === 'seller') {
    return <SellerScreen mode={mode} sellerId={state.sellerId} onBack={goFeed} onOpenCar={(c) => goCar(c.id)} />;
  }
  return <FeedScreen mode={mode} onOpenCar={(c) => goCar(c.id)} />;
}

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="feed"
        title="Feed principal · /autos"
        subtitle="Punto de entrada. Click en cualquier tarjeta abre la ficha en el mismo artboard; desde ahí puedes navegar al perfil del vendedor."
      >
        <DCArtboard id="feed-desktop" label="Desktop · 1280" width={1280} height={1480}>
          <ArtboardFrame><Flow mode="desktop" /></ArtboardFrame>
        </DCArtboard>
        <DCArtboard id="feed-mobile" label="Mobile · 390" width={390} height={1480}>
          <ArtboardFrame><Flow mode="mobile" /></ArtboardFrame>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="ficha"
        title="Ficha individual · /autos/[slug]"
        subtitle="Galería tipo carrete fílmico (drag, peek lateral, sprocket holes, indicador progresivo). Logotipo del vendedor visible en la card lateral con stripe de marca."
      >
        <DCArtboard id="ficha-desktop" label="Desktop · 1280" width={1280} height={1480}>
          <ArtboardFrame>
            <Flow mode="desktop" initial={{ view: 'ficha', carId: 'toyota-hilux-2022' }} />
          </ArtboardFrame>
        </DCArtboard>
        <DCArtboard id="ficha-mobile" label="Mobile · 390 · sticky CTA" width={390} height={1480}>
          <ArtboardFrame>
            <Flow mode="mobile" initial={{ view: 'ficha', carId: 'toyota-hilux-2022' }} />
          </ArtboardFrame>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="vendedor"
        title="Perfil del vendedor · /vendedores/[slug]"
        subtitle="Hero con logo grande, color de marca aplicado en gradient, stats, inventario filtrable y bloque de contacto. Cada lote se siente como su propia marca dentro de LoteCUU."
      >
        <DCArtboard id="seller-desktop" label="Desktop · Autos Lira" width={1280} height={1500}>
          <ArtboardFrame>
            <Flow mode="desktop" initial={{ view: 'seller', sellerId: 'autos-lira' }} />
          </ArtboardFrame>
        </DCArtboard>
        <DCArtboard id="seller-mobile" label="Mobile · Autos Lira" width={390} height={1640}>
          <ArtboardFrame>
            <Flow mode="mobile" initial={{ view: 'seller', sellerId: 'autos-lira' }} />
          </ArtboardFrame>
        </DCArtboard>
        <DCArtboard id="seller-desktop-2" label="Desktop · Carros del Valle" width={1280} height={1500}>
          <ArtboardFrame>
            <Flow mode="desktop" initial={{ view: 'seller', sellerId: 'carros-valle' }} />
          </ArtboardFrame>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="admin"
        title="Panel de admin · /admin"
        subtitle="Versión simple. El vendedor sube logo, edita identidad y gestiona su inventario. Mensajes llegan por WhatsApp; aquí solo verá historial."
      >
        <DCArtboard id="admin-desktop" label="Desktop · Inventario" width={1280} height={900}>
          <ArtboardFrame><AdminScreen mode="desktop" sellerId="autos-lira" /></ArtboardFrame>
        </DCArtboard>
        <DCArtboard id="admin-mobile" label="Mobile" width={390} height={900}>
          <ArtboardFrame><AdminScreen mode="mobile" sellerId="autos-lira" /></ArtboardFrame>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
